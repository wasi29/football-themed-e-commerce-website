    <script>
      /* Apply the admin panel's saved colour theme before first paint so a
         dark-mode admin never sees a white flash. Scoped to /admin so the
         storefront (which has no dark styles) is untouched. This reads a UI
         preference only — it grants no access, the guard does that. */
      (function () {
        if (location.pathname.indexOf('/admin') !== 0) return;
        try {
          var t = localStorage.getItem('ftx.admin.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
